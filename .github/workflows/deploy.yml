name: Despliegue Automático en AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Desplegar API en EC2
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y actualizar aplicación
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use default

            cd ~/performanceTest-fleecore
            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            if pm2 describe nestjs-api > /dev/null 2>&1; then
              pm2 reload nestjs-api --update-env
            else
              pm2 start dist/main.js --name nestjs-api
            fi
            pm2 save